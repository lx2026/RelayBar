name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Select Xcode with Swift 6.2 or newer
        run: bash ./scripts/select-ci-xcode.sh
      - name: Test desktop and mobile apps, shared packages and SSH transport
        run: ./scripts/test.sh
      - name: Build Frame for Apple silicon
        run: swift build --package-path Apps/Frame --arch arm64 --product Frame -Xswiftc -warnings-as-errors
      - name: Build macOS project without signing
        run: >-
          xcodebuild
          -project Apps/RelayBar/RelayBar.xcodeproj
          -scheme RelayBar
          -configuration Release
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
