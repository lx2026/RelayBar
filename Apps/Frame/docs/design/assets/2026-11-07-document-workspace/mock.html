<!doctype html><meta charset="utf-8"><title>Frame · Folder workspace</title>
<style>*{box-sizing:border-box}body{margin:32px;background:#dddcd7;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#262824}main{height:740px;background:#fafaf8;border:1px solid #bdbfb8;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px #0001}header{height:58px;padding:16px 22px;border-bottom:1px solid #dedfd8;display:flex;gap:24px;align-items:center}button{background:#fff;border:1px solid #d1d3ca;border-radius:5px;padding:5px 12px;color:inherit;cursor:pointer}header small{flex:1;color:#686c62}.workspace{display:flex;height:calc(100% - 58px)}aside{width:240px;resize:horizontal;overflow:auto;border-right:1px solid #dedfd8;background:#f1f2ed;padding:16px 10px;min-width:180px}aside button{display:block;text-align:left;border:0;background:none;width:100%;padding:10px 20px}aside button:focus{background:#dee3d5}.preview{flex:1;overflow:auto;padding:46px 64px}article{max-width:800px;margin:auto;line-height:1.6}h1{font-size:32px;margin:0 0 22px}h2{font-size:20px}pre{background:#edf0e7;padding:20px;border-radius:5px}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}.chart{height:260px;display:flex;align-items:end;gap:22px;padding:25px;background:#eff1e9;border-radius:8px}.chart i{display:block;background:#68785a;flex:1}.media{background:#232722;min-height:450px;display:grid;place-items:center;color:#eee;border-radius:6px}small{color:#697260}</style>
<main><header><button>Open…</button><small id="path">project / notes.md</small><button>Preview</button><button>Grid</button><button>Info</button></header><div class="workspace"><aside><button>▾ project</button><button onclick="show('notes.md')">　notes.md</button><button onclick="show('report.html')">　report.html</button><button onclick="show('demo.mp4')">　demo.mp4</button><button>　▾ images</button><button onclick="show('images/result.png')">　　result.png</button></aside><div class="preview"><article id="page"></article></div></div></main>
<script>const pages={'notes.md':'<h1>Review notes</h1><p>A folder of working files, ready to read.</p><h2>What changed</h2><ul><li>Preview the latest report.</li><li>Compare the image and video outputs.</li></ul><pre>outputs/\n  report.html\n  demo.mp4\n  images/result.png</pre><table><tr><th>Run</th><th>Time</th><th>Result</th></tr><tr><td>A</td><td>12 s</td><td>Baseline</td></tr><tr><td>B</td><td>8 s</td><td>Selected</td></tr></table>','report.html':'<h1>Run comparison</h1><p>Interactive HTML, rendered from the selected folder.</p><div class="chart"><i style="height:68%"></i><i style="height:45%"></i><i style="height:90%"></i><i style="height:60%"></i></div><p>Scale <input type="range" oninput="document.querySelector(\'.chart\').style.opacity=.4+this.value/170"></p>','demo.mp4':'<div class="media">▶　Demo video</div>','images/result.png':'<div class="media" style="background:linear-gradient(140deg,#c3cbaa,#596954,#253323)">Image preview</div>'};function show(name){document.getElementById('path').textContent='project / '+name;document.getElementById('page').innerHTML=pages[name]}show('notes.md')</script>
